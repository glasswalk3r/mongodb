# Rocky Linux unattended install from the DVD image.
text
cdrom
eula --agreed
firstboot --disable

lang en_US.UTF-8
keyboard --vckeymap=br-abnt2 --xlayouts='br(abnt2)'
timezone UTC --utc

network --bootproto=dhcp --device=link --activate --onboot=on --hostname=rocky-box
firewall --enabled --service=ssh
selinux --enforcing

rootpw --lock
user --name=vagrant --groups=wheel --password=vagrant --plaintext

zerombr
clearpart --all --initlabel
autopart --type=plain --fstype=xfs --nohome
bootloader --timeout=1

services --enabled=sshd

reboot --eject

%packages --ignoremissing
@^minimal-environment
openssh-server
sudo
curl
tar
bzip2
# Not needed in a VirtualBox guest: firmware and microcode, crash dumps, rescue
# image, spell checking, IRQ balancing, RAID and non-XFS file system tools.
-linux-firmware*
-*-firmware
-microcode_ctl
-kdump-utils
-kexec-tools
-makedumpfile
-dracut-config-rescue
-dracut-network
-dracut-squash
-hunspell*
-irqbalance
-udisks2
-mdadm
-e2fsprogs
-exfatprogs
-grub2-tools-extra
-mtools
%end

# Otherwise anaconda installs kdump-utils and reserves crash kernel memory.
%addon com_redhat_kdump --disable
%end

%post --erroronfail
echo 'vagrant ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/vagrant
chmod 440 /etc/sudoers.d/vagrant
sed -i 's/^Defaults\s*requiretty/# &/' /etc/sudoers
%end
