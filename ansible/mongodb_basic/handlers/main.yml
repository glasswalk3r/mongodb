---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reapply THP settings
  ansible.builtin.systemd_service:
    name: mongod-thp.service
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload udev
  ansible.builtin.shell: |
    udevadm control --reload
    udevadm trigger --subsystem-match=block --action=change
  changed_when: true

# Plain remount re-reads the options from /etc/fstab; avoids an ansible.posix dependency.
- name: Remount data file system
  ansible.builtin.command: "mount -o remount {{ data_mount }}"  # noqa: command-instead-of-module
  changed_when: true

# try-restart only restarts a running mongod. A first run never starts it with
# the RPM's default mongod.conf; the role that writes mongod.conf starts it.
# rc 5 is "unit not found": a playbook's pre_tasks can notify this before the
# role has installed MongoDB (handlers flush at the end of pre_tasks).
- name: Restart mongod
  ansible.builtin.command: systemctl try-restart mongod  # noqa: command-instead-of-module
  register: mongod_restart
  changed_when: mongod_restart.rc == 0
  failed_when: mongod_restart.rc not in [0, 5]
