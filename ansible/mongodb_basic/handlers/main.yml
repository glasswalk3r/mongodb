---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reapply THP settings
  ansible.builtin.systemd_service:
    name: mongod-thp.service
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload udev
  ansible.builtin.shell: |
    udevadm control --reload
    udevadm trigger --subsystem-match=block --action=change
  changed_when: true

# Plain remount re-reads the options from /etc/fstab; avoids an ansible.posix dependency.
- name: Remount data file system
  ansible.builtin.command: "mount -o remount {{ data_mount }}"  # noqa: command-instead-of-module
  changed_when: true

- name: Restart mongod
  ansible.builtin.systemd_service:
    name: mongod
    state: restarted
