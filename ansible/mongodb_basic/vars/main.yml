---
# Paths and ports covered by the MongoDB SELinux policy.
selinux_default_db_path: /var/lib/mongo
selinux_default_log_path: /var/log/mongodb/mongod.log
selinux_ports: [27017, 27018, 27019]

# Kernels with a TCMalloc incompatibility; mongod refuses to start on them.
bad_kernel_min: "6.19"
bad_kernel_max: "7.0.13"

selinux_build_packages:
  - git
  - make
  - checkpolicy
  - policycoreutils
  - policycoreutils-python-utils
  - selinux-policy-devel

# Overrides firewalld's bundled mongodb service (same name, /usr/lib) with
# mongod_port; package updates leave /etc alone.
firewalld_service_file: /etc/firewalld/services/mongodb.xml
