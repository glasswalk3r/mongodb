---
- name: Write kernel settings for mongod
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/90-mongod.conf
    mode: "0644"
  notify: Reload sysctl

- name: Write udev rule for readahead and I/O scheduler
  ansible.builtin.template:
    src: udev.rules.j2
    dest: /etc/udev/rules.d/60-mongod-block.rules
    mode: "0644"
  notify: Reload udev

- name: Add noatime to the data file system
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\S+\s+{{ data_mount | regex_escape }}\s+\S+\s+)(?!(?:\S*,)?noatime(?:,|\s))(\S+)(\s.*)$'
    replace: '\1\2,noatime\3'
  when: noatime
  notify: Remount data file system
