---
- name: Install SELinux policy build dependencies
  ansible.builtin.dnf:
    name: "{{ selinux_build_packages }}"
    state: present

- name: Fetch the MongoDB SELinux policy source
  ansible.builtin.git:
    repo: "{{ selinux_repo }}"
    dest: "{{ selinux_src_dir }}"
    version: "{{ selinux_version }}"
  register: selinux_src

- name: Check installed SELinux modules
  ansible.builtin.command: semodule --list-modules=full
  register: semodules
  changed_when: false

# The upstream module is installed at priority 200, overriding the older
# "mongodb" module shipped in selinux-policy-targeted (priority 100).
- name: Build and install the MongoDB SELinux policy
  ansible.builtin.shell: |
    set -e
    make clean
    make
    make install
  args:
    chdir: "{{ selinux_src_dir }}"
  when: >-
    selinux_src is changed or
    semodules.stdout is not search('^200\s+mongodb\s', multiline=True)
  changed_when: true
  notify: Restart mongod
