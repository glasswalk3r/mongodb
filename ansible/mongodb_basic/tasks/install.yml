---
- name: Add the MongoDB repository
  ansible.builtin.yum_repository:
    name: "mongodb-org-{{ version }}"
    description: MongoDB Repository
    baseurl: "{{ repo_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ repo_gpgkey }}"
    enabled: true

- name: Install MongoDB packages
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
  register: install
  until: install is succeeded
  retries: 5
  delay: 10

- name: Install chrony for time synchronization
  ansible.builtin.dnf:
    name: chrony
    state: present
  register: chrony_install
  until: chrony_install is succeeded
  retries: 5
  delay: 10

- name: Enable chronyd
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started
