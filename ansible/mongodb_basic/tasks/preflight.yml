---
- name: Check platform
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'RedHat'
      - ansible_facts.architecture == 'x86_64'
    fail_msg: This role supports RHEL-compatible x86_64 hosts only.

- name: Check kernel is not affected by the TCMalloc incompatibility
  vars:
    _kernel: "{{ ansible_facts.kernel.split('-')[0] }}"
  ansible.builtin.assert:
    that: >-
      _kernel is version(bad_kernel_min, '<') or
      _kernel is version(bad_kernel_max, '>')
    fail_msg: >-
      mongod refuses to start on kernels {{ bad_kernel_min }} through
      {{ bad_kernel_max }}; running {{ ansible_facts.kernel }}.

- name: Check settings are compatible with the MongoDB SELinux policy
  ansible.builtin.assert:
    that:
      - db_path == selinux_default_db_path
      - log_path == selinux_default_log_path
      - mongod_port | int in selinux_ports
    fail_msg: >-
      The MongoDB SELinux policy only supports the default dbPath, log path
      and ports. Use the defaults or set selinux_policy to false and
      provide a custom policy.
  when: selinux_policy
