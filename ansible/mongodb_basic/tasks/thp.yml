---
- name: Install the THP systemd unit
  ansible.builtin.template:
    src: mongod-thp.service.j2
    dest: /etc/systemd/system/mongod-thp.service
    mode: "0644"
  register: thp_unit

- name: Enable and apply the THP unit
  ansible.builtin.systemd_service:
    name: mongod-thp.service
    enabled: true
    state: "{{ 'restarted' if thp_unit is changed else 'started' }}"
    daemon_reload: "{{ thp_unit is changed }}"

- name: Gather package facts
  ansible.builtin.package_facts:

- name: Configure a tuned profile that keeps the THP setting
  when: "'tuned' in ansible_facts.packages"
  vars:
    tuned_dir: "{{ '/etc/tuned/profiles' if tuned_profiles_dir.stat.isdir | default(false) else '/etc/tuned' }}/mongodb"
  block:
    - name: Detect the recommended tuned base profile
      ansible.builtin.command: tuned-adm recommend
      register: tuned_recommend
      changed_when: false
      when: tuned_base_profile | length == 0

    # tuned >= 2.23 reads user profiles from /etc/tuned/profiles.
    - name: Find the tuned user profile directory
      ansible.builtin.stat:
        path: /etc/tuned/profiles
      register: tuned_profiles_dir

    - name: Create the tuned profile directory
      ansible.builtin.file:
        path: "{{ tuned_dir }}"
        state: directory
        mode: "0755"

    - name: Write the mongodb tuned profile
      ansible.builtin.template:
        src: tuned.conf.j2
        dest: "{{ tuned_dir }}/tuned.conf"
        mode: "0644"
      vars:
        tuned_include: "{{ tuned_base_profile or tuned_recommend.stdout | trim }}"
      register: tuned_profile

    - name: Check the active tuned profile
      ansible.builtin.command: tuned-adm active
      register: tuned_active
      changed_when: false
      failed_when: false

    - name: Activate the mongodb tuned profile
      ansible.builtin.command: tuned-adm profile mongodb
      when: >-
        tuned_profile is changed or
        tuned_active.stdout is not search(': mongodb$', multiline=True)
      changed_when: true
      notify: Reapply THP settings
