---
# MongoDB release series (selects the yum repository).
version: "8.0"
packages:
  - mongodb-org

# mongod.conf. The MongoDB SELinux policy only supports the RPM defaults for
# port, dbPath, systemLog.path and pidFilePath; the role refuses to run with
# other values while selinux_policy is true.
port: 27017
bind_ip: 127.0.0.1
db_path: /var/lib/mongo
log_path: /var/log/mongodb/mongod.log

# WiredTiger cache and FTDC (diagnostic.data) size limits; 0 keeps the MongoDB
# default. Small values suit test VMs with little RAM and disk.
cache_size_gb: 0
ftdc_dir_size_mb: 0

# Allow the firewalld mongodb service, rewritten to use port; needed
# when bind_ip includes a non-loopback address.
firewall: false
# firewalld zone to open it in. Rocky's default zone is "public"; use
# "internal" (bound to a trusted source subnet) to restrict access.
firewall_zone: public

# Official SELinux policy (https://github.com/mongodb/mongodb-selinux).
selinux_policy: true
selinux_repo: https://github.com/mongodb/mongodb-selinux
# Pinned commit; bump deliberately after reviewing upstream changes.
selinux_version: 18181652362a46fd4511a56f20c4055712deb252
selinux_src_dir: /usr/local/src/mongodb-selinux

# Transparent Huge Pages. MongoDB 8.0+ (new TCMalloc) wants THP enabled;
# 7.0 and earlier want it disabled.
thp_enabled: "{{ 'always' if version is version('8.0', '>=') else 'never' }}"
thp_defrag: "{{ 'defer+madvise' if version is version('8.0', '>=') else 'never' }}"
thp_max_ptes_none: 0
thp_sysfs: /sys/kernel/mm/transparent_hugepage

# tuned: when installed, a "mongodb" profile is layered on top of this base
# profile. Empty means use `tuned-adm recommend` (virtual-guest on a VM).
tuned_base_profile: ""

# Disable glibc rseq registration so TCMalloc can use per-CPU caches
# (needed with the glibc shipped by EL9+).
glibc_rseq_disable: true

# Kernel settings (production notes).
sysctl:
  vm.swappiness: 1
  vm.overcommit_memory: 1
  vm.zone_reclaim_mode: 0
  net.ipv4.tcp_keepalive_time: 120

# Block devices: readahead 8-32 sectors (4-16 KiB) and the "none" I/O
# scheduler for hypervisor-backed disks.
readahead_kb: 16
io_scheduler: none
block_devices: "sd[a-z]|vd[a-z]|nvme[0-9]*n[0-9]*"

# Add noatime to the fstab entry of the file system that holds dbPath.
noatime: true
data_mount: /

# Resource limits for the mongod service (ulimit reference).
limit_nofile: 64000
limit_nproc: 64000

service_enabled: true
