---
# Small footprint for 1 GB test VMs.
mongod_cache_size_gb: 0.25
mongod_oplog_size_mb: 990
mongod_ftdc_dir_size_mb: 50

# Members talk over the host-only network; node_ip comes from the Vagrantfile.
mongod_bind_ip: "127.0.0.1,{{ node_ip }}"
mongod_firewall: true

# Each replica set is an inventory group named after the set; its first host
# initiates it.
mongod_replset_members: "{{ groups[mongod_replset_name] | map('extract', hostvars, 'node_ip') | product([':' ~ mongod_port]) | map('join') | list }}"
mongod_replset_initiate: "{{ inventory_hostname == groups[mongod_replset_name][0] }}"
